<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Legacy Cheer Battle Run</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="appShell">
    <section id="gameFrame" aria-label="Game Frame">
      <canvas id="gameCanvas" width="1280" height="720" aria-label="Legacy Cheer Battle Run"></canvas>
      <div id="hud">
        <span id="hudLevel">Level 1</span>
        <span id="hudLives">Lives: 10</span>
        <span id="hudScore">Score: 0</span>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
